name: Build & Publish PinPulse Admin Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed PinPulse Admin APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Line Endings and Permissions for Gradle Wrapper
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Calculate Release Version (Semantic v1.0.X + 1 Step)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GIT_TAGS=$(git tag -l 'v*' || true)
          GH_TAGS=$(gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          HIGHEST_VER=$(printf "%s\n%s\n" "${GIT_TAGS}" "${GH_TAGS}" \
            | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1 || true)

          if [ -n "${HIGHEST_VER}" ]; then
            CUR_MAJOR=$(echo "${HIGHEST_VER}" | cut -d. -f1)
            CUR_MINOR=$(echo "${HIGHEST_VER}" | cut -d. -f2)
            CUR_PATCH=$(echo "${HIGHEST_VER}" | cut -d. -f3)
            NEXT_PATCH=$((CUR_PATCH + 1))
            VERSION_NAME="${CUR_MAJOR}.${CUR_MINOR}.${NEXT_PATCH}"
          else
            NEXT_PATCH=$((GITHUB_RUN_NUMBER > 8 ? GITHUB_RUN_NUMBER : 9))
            VERSION_NAME="1.0.${NEXT_PATCH}"
          fi

          RUN_CODE=$((100 + GITHUB_RUN_NUMBER))
          TAG_CODE=$((100 + NEXT_PATCH))
          if [ "${TAG_CODE}" -gt "${RUN_CODE}" ]; then
            VERSION_CODE=${TAG_CODE}
          else
            VERSION_CODE=${RUN_CODE}
          fi

          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "Highest existing tag: v${HIGHEST_VER:-none} -> Building PinPulse Admin v${VERSION_NAME} (code=${VERSION_CODE})..."

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ env.VERSION_CODE }} \
            -PversionName=${{ env.VERSION_NAME }} \
            --no-daemon

      - name: Stage Release APK Asset
        run: |
          APK_FILE="PinPulseAdmin-v${{ env.VERSION_NAME }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_FILE}"
          echo "APK_FILE=${APK_FILE}" >> $GITHUB_ENV
          ls -lh "${APK_FILE}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "PinPulse Admin v${{ env.VERSION_NAME }} (Build #${{ github.run_number }})"
          body: |
            ### PinPulse Master Admin Console (APK Release)
            - **Hardware-Secured PC Web Console**: Authenticated for authorized workstation MAC `0A-E0-AF-A6-0E-2F` (`server.js`).
            - **Master Password Security**: Requires setup of an encrypted master password on first launch and unlocks subsequent sessions.
            - **Friendship Network & Live Inspector**: Inspects "who is friends with whom" across all fleet nodes in real time.
            - **⚡ Instant Force-Pairing Engine**: Remote zero-code force pairing between any two users without requiring invitations or acceptance.
            - **SaaS CRM & Subscriptions**: Full pack management (Demo, Family, Business, Custom), accounts lock/unlock, speed limits, live radar map.
          files: |
            ${{ env.APK_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
